<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
  <a class="brand" href="#top" aria-label="Intuise UX Solution, home" (click)="closeMenu()">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Intuise</span>
    <span class="brand-descriptor">UX Solution</span>
  </a>

  <button
    class="menu-toggle"
    type="button"
    aria-label="Toggle navigation"
    [attr.aria-expanded]="menuOpen"
    aria-controls="primary-navigation"
    (click)="toggleMenu()"
  >
    <span></span><span></span>
  </button>

  <nav
    id="primary-navigation"
    class="primary-nav"
    [class.is-open]="menuOpen"
    aria-label="Primary navigation"
  >
    <a href="#work" (click)="closeMenu()">Work</a>
    <a href="#services" (click)="closeMenu()">Services</a>
    <a href="#approach" (click)="closeMenu()">Approach</a>
    <a href="#about" (click)="closeMenu()">About</a>
    <a class="nav-cta" href="#contact" (click)="closeMenu()">Start a conversation</a>
  </nav>
</header>

<router-outlet />

<footer class="site-footer">
  <div class="footer-statement">
    <span class="eyebrow">Intuise UX Solution</span>
    <p>Clear interfaces. Thoughtful systems. Frontend that holds up.</p>
  </div>
  <div class="footer-meta">
    <p>Jakarta, Indonesia · Working remotely</p>
    <p>© {{ currentYear }} Intuise</p>
  </div>
</footer>
